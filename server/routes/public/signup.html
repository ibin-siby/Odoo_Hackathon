
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Brightloop Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card shadow p-4" style="width: 100%; max-width: 450px;">

            <h2 class="text-center mb-2">Create Account</h2>
            <p class="text-center text-muted mb-4">Join Brightloop Software</p>

            <div id="message" class="alert d-none"></div>

            <form id="signupForm">

                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" minlength="9" required>
                    <small class="text-muted">Minimum 9 characters.</small>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Create Account
                </button>

            </form>

            <p class="text-center mt-3 mb-0">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
