<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal | Brightloop Software</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="portal.html">Brightloop Software</a>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white" id="welcomeName"></span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h2 class="mb-4">Customer Portal</h2>

        <div id="message" class="alert d-none"></div>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <h4 class="card-title">My Subscriptions</h4>
                <div class="table-responsive">
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>Subscription No.</th>
                                <th>Plan</th>
                                <th>Status</th>
                                <th>Start Date</th>
                                <th>Expiry Date</th>
                            </tr>
                        </thead>
                        <tbody id="subscriptionsTable">
                            <tr>
                                <td colspan="5" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title">My Invoices</h4>
                <div class="table-responsive">
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>Invoice No.</th>
                                <th>Invoice Date</th>
                                <th>Total</th>
                                <th>Outstanding</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTable">
                            <tr>
                                <td colspan="5" class="text-center">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/portal.js"></script>

</body>
</html>
