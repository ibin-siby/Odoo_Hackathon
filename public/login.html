<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Brightloop Subscription Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, #29243A 0%, #3D3556 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
        .demo-pill {
            font-size: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--ivory);
            transition: var(--transition);
        }
        .demo-pill:hover {
            background: var(--plum);
            color: white;
            border-color: var(--plum);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="brand-font mb-1" style="font-size: 32px; color: var(--plum);">Brightloop</h2>
            <p class="text-muted small">Subscription Management Platform</p>
        </div>

        <div id="message" class="alert d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
                <input type="email" class="form-control py-2" id="email" placeholder="name@company.com" required>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label small fw-bold text-muted">PASSWORD</label>
                    <a href="forgot-password.html" class="small">Forgot?</a>
                </div>
                <input type="password" class="form-control py-2" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-brightloop w-100 py-2 justify-content-center mt-2" id="loginBtn">
                Sign In to Platform
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <div class="small fw-semibold text-muted mb-2 text-center">Quick Demo Logins:</div>
            <div class="d-flex justify-content-center gap-2">
                <button type="button" class="demo-pill" onclick="quickFill('admin@brightloop.com', 'Admin@12345')">Admin</button>
                <button type="button" class="demo-pill" onclick="quickFill('staff@brightloop.com', 'Staff@12345')">Staff</button>
                <button type="button" class="demo-pill" onclick="quickFill('customer@brightloop.com', 'Customer@12345')">Customer</button>
            </div>
        </div>

        <div class="text-center mt-4">
            <span class="text-muted small">New customer?</span>
            <a href="signup.html" class="small fw-bold ms-1">Create Account</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function quickFill(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }
    </script>
</body>
</html>
