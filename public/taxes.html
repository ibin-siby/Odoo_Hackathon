<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Rules | Brightloop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 mb-1">Tax Configuration</h1>
                <p class="text-muted mb-0">Define regional VAT, GST, and service tax rates applied during billing calculation.</p>
            </div>
            <div>
                <button class="btn btn-brightloop btn-sm" data-bs-toggle="modal" data-bs-target="#taxModal">
                    <span>+</span> <span>New Tax Rule</span>
                </button>
            </div>
        </div>

        <div class="surface">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tax Name</th>
                            <th>Rate (%)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taxesTable">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Loading taxes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Tax Modal -->
    <div class="modal fade" id="taxModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-md);">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title brand-font">Create Tax Rule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="taxForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">TAX NAME</label>
                            <input type="text" class="form-control" id="taxName" placeholder="e.g. GST (18%)" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">TAX RATE (%)</label>
                            <input type="number" class="form-control" id="taxRate" step="0.01" min="0" placeholder="18.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">STATUS</label>
                            <select class="form-select" id="taxStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary-custom btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brightloop btn-sm">Save Tax</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/command-palette.js"></script>
    <script>
        async function loadTaxes() {
            try {
                const res = await window.api.get('/api/taxes');
                const list = res.data || [];
                const tbody = document.getElementById('taxesTable');
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No taxes defined.</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(t => `
                    <tr>
                        <td>#${t.id}</td>
                        <td><strong>${t.name}</strong></td>
                        <td><strong>${Number(t.rate).toFixed(2)}%</strong></td>
                        <td><span class="badge-status status-${t.status}">${t.status}</span></td>
                        <td>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteTax(${t.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteTax(id) {
            if (!confirm('Delete this tax rule?')) return;
            try {
                await window.api.delete('/api/taxes/' + id);
                loadTaxes();
            } catch (err) { alert(err.message); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTaxes();
            const form = document.getElementById('taxForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    try {
                        await window.api.post('/api/taxes', {
                            name: document.getElementById('taxName').value.trim(),
                            rate: Number(document.getElementById('taxRate').value),
                            status: document.getElementById('taxStatus').value
                        });
                        const modal = bootstrap.Modal.getInstance(document.getElementById('taxModal'));
                        if (modal) modal.hide();
                        form.reset();
                        loadTaxes();
                    } catch (err) { alert(err.message); }
                });
            }
        });
    </script>
</body>
</html>
