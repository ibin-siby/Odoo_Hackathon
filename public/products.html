<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog | Brightloop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 mb-1">Products & Services Catalog</h1>
                <p class="text-muted mb-0">Manage SaaS subscriptions, add-ons, software licenses, and billable products.</p>
            </div>
            <div>
                <button class="btn btn-brightloop btn-sm" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAddProduct()">
                    <span>+</span> <span>Add Product</span>
                </button>
            </div>
        </div>

        <div id="message" class="alert d-none"></div>

        <div class="surface">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable">
                        <tr><td colspan="6" class="text-center py-4 text-muted">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Product Modal (Add / Edit) -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-md);">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title brand-font" id="productModalTitle">Add New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="productForm">
                    <div class="modal-body p-4">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">PRODUCT NAME</label>
                            <input type="text" class="form-control" id="name" placeholder="e.g. Enterprise Cloud VPS" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">DESCRIPTION</label>
                            <textarea class="form-control" id="description" rows="2" placeholder="Product details..."></textarea>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">PRICE (₹)</label>
                                <input type="number" class="form-control" id="price" step="0.01" min="0" placeholder="0.00" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">STATUS</label>
                                <select class="form-select" id="status">
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary-custom btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brightloop btn-sm" id="saveProductBtn">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/command-palette.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
