<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard | Odoo</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <header class="navbar">
        <h2>Odoo Finance</h2>
        <span>Subscription Management</span>
    </header>

    <main class="container">

        <h1>Finance Dashboard</h1>
        <p class="subtitle">Monitor payments and financial performance.</p>

        <section class="stats">

            <div class="card">
                <h3>Total Revenue</h3>
                <p id="totalRevenue">₹0.00</p>
            </div>

            <div class="card">
                <h3>Outstanding Amount</h3>
                <p id="outstandingAmount">₹0.00</p>
            </div>

            <div class="card">
                <h3>Total Payments</h3>
                <p id="totalPayments">0</p>
            </div>

        </section>

        <section class="table-section">
            <h2>Recent Payments</h2>

            <table>
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Customer</th>
                        <th>Invoice</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody id="paymentsTable">
                    <tr>
                        <td colspan="5">Loading payments...</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <script src="js/dashboard.js"></script>

</body>
</html>
