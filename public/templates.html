<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Templates | Brightloop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 mb-1">Quotation Templates</h1>
                <p class="text-muted mb-0">Standardized quotation configurations to quickly convert customer deals into subscriptions.</p>
            </div>
            <div>
                <button class="btn btn-brightloop btn-sm" data-bs-toggle="modal" data-bs-target="#templateModal" onclick="prepareAddTemplate()">
                    <span>+</span> <span>New Template</span>
                </button>
            </div>
        </div>

        <div class="surface">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Template Name</th>
                            <th>Description</th>
                            <th>Validity</th>
                            <th>Included Products</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="templatesTable">
                        <tr><td colspan="5" class="text-center py-4 text-muted">Loading quotation templates...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Template Modal -->
    <div class="modal fade" id="templateModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-md);">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title brand-font">Create Quotation Template</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="templateForm">
                    <div class="modal-body p-4">
                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label class="form-label small fw-bold">TEMPLATE NAME</label>
                                <input type="text" class="form-control" id="tmplName" placeholder="e.g. Enterprise Cloud Bundle" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">VALIDITY (DAYS)</label>
                                <input type="number" class="form-control" id="tmplValidity" value="30" min="1" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">DESCRIPTION</label>
                            <textarea class="form-control" id="tmplDescription" rows="2" placeholder="Bundle notes and terms..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0 text-muted">INCLUDED PRODUCT LINES</h6>
                            <button type="button" class="btn btn-sm btn-outline-dark" id="addTmplLineBtn">+ Add Product</button>
                        </div>

                        <div id="tmplLinesContainer" class="d-flex flex-column gap-2"></div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary-custom btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brightloop btn-sm">Save Template</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/command-palette.js"></script>
    <script src="js/templates.js"></script>
</body>
</html>
