<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Brightloop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        body {
            background: linear-gradient(135deg, #29243A 0%, #3D3556 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="brand-font mb-1" style="font-size: 32px; color: var(--plum);">Reset Password</h2>
            <p class="text-muted small">Enter your email to receive a password reset token</p>
        </div>

        <div id="message" class="alert d-none"></div>

        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-muted">EMAIL ADDRESS</label>
                <input type="email" class="form-control py-2" id="email" placeholder="name@company.com" required>
            </div>

            <button type="submit" class="btn btn-brightloop w-100 py-2 justify-content-center mt-2">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="login.html" class="small fw-bold">Back to Login</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
