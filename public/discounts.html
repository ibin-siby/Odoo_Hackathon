<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discounts & Coupons | Brightloop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="h2 mb-1">Discounts & Promo Rules</h1>
                <p class="text-muted mb-0">Automate percentage and fixed promotional discounts based on purchase quantity and order minimums.</p>
            </div>
            <div>
                <button class="btn btn-brightloop btn-sm" data-bs-toggle="modal" data-bs-target="#discountModal">
                    <span>+</span> <span>New Discount Rule</span>
                </button>
            </div>
        </div>

        <div class="surface">
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Discount Name</th>
                            <th>Type</th>
                            <th>Value</th>
                            <th>Min Purchase</th>
                            <th>Min Qty</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="discountsTable">
                        <tr><td colspan="7" class="text-center py-4 text-muted">Loading discounts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Discount Modal -->
    <div class="modal fade" id="discountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg" style="border-radius: var(--radius-md);">
                <div class="modal-header border-bottom">
                    <h5 class="modal-title brand-font">Create Discount Rule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="discountForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">DISCOUNT NAME</label>
                            <input type="text" class="form-control" id="discName" placeholder="e.g. Early Bird 15%" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">TYPE</label>
                                <select class="form-select" id="discType" required>
                                    <option value="percentage">Percentage (%)</option>
                                    <option value="fixed">Fixed Amount (₹)</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">VALUE</label>
                                <input type="number" class="form-control" id="discValue" step="0.01" min="0" placeholder="10.00" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">MIN PURCHASE (₹)</label>
                                <input type="number" class="form-control" id="discMinPurchase" step="0.01" min="0" value="0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">MIN QUANTITY</label>
                                <input type="number" class="form-control" id="discMinQty" min="0" value="0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">STATUS</label>
                            <select class="form-select" id="discStatus">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-top bg-light">
                        <button type="button" class="btn btn-secondary-custom btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-brightloop btn-sm">Save Discount</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/command-palette.js"></script>
    <script>
        async function loadDiscounts() {
            try {
                const res = await window.api.get('/api/discounts');
                const list = res.data || [];
                const tbody = document.getElementById('discountsTable');
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No discounts defined.</td></tr>';
                    return;
                }
                tbody.innerHTML = list.map(d => `
                    <tr>
                        <td><strong>${d.name}</strong></td>
                        <td><span class="badge bg-light text-dark border text-capitalize">${d.discount_type}</span></td>
                        <td><strong class="text-success">${d.discount_type === 'percentage' ? Number(d.value) + '%' : '₹' + Number(d.value).toFixed(2)}</strong></td>
                        <td>₹${Number(d.min_purchase || 0).toFixed(2)}</td>
                        <td>${d.min_quantity || 0}</td>
                        <td><span class="badge-status status-${d.status}">${d.status}</span></td>
                        <td>
                            <button class="btn btn-outline-danger btn-sm" onclick="deleteDiscount(${d.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function deleteDiscount(id) {
            if (!confirm('Delete this discount?')) return;
            try {
                await window.api.delete('/api/discounts/' + id);
                loadDiscounts();
            } catch (err) { alert(err.message); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDiscounts();
            const form = document.getElementById('discountForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    try {
                        await window.api.post('/api/discounts', {
                            name: document.getElementById('discName').value.trim(),
                            discount_type: document.getElementById('discType').value,
                            value: Number(document.getElementById('discValue').value),
                            min_purchase: Number(document.getElementById('discMinPurchase').value) || 0,
                            min_quantity: Number(document.getElementById('discMinQty').value) || 0,
                            status: document.getElementById('discStatus').value
                        });
                        const modal = bootstrap.Modal.getInstance(document.getElementById('discountModal'));
                        if (modal) modal.hide();
                        form.reset();
                        loadDiscounts();
                    } catch (err) { alert(err.message); }
                });
            }
        });
    </script>
</body>
</html>
